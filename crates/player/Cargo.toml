[package]
name = "player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true


[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "isomp4"] }
thiserror.workspace = true
tempfile = "3"
rubato = "5.0.1"
rtrb = "0.4"
fastframe-audio = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
log = "0.4"
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
wasapi = "0.25"

# Hog mode (`audio_unit::macos_helpers`); the features cpal already builds it with.
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "0.14", default-features = false, features = ["core_audio", "audio_toolbox"] }
