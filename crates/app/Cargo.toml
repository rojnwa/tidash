[package]
name = "tidash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# serde: the settings keep a palette's `Color32`s (`custom_theme_cache`).
egui = { workspace = true, features = ["serde"] }
eframe.workspace = true
# svg: the icons' loader (`setup_look`).
egui_extras.workspace = true
tidal = { path = "../tidal" }
player = { path = "../player" }
tokio = { workspace = true, features = ["sync", "time"] }
reqwest = { workspace = true, features = ["blocking"] }
open = "5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
rand = "0.10"
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0" }
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0" }
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0" }
fastframe-audio = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0" }
fastframe-now-playing = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0" }
fastframe-scroll = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0" }
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0" }
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0" }
fastframe-instance = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0" }
# Self-update (`update`), over our reqwest: its `reqwest` feature would add reqwest 0.12.
fastframe-update = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0" }
# `fastframe_update::Transport::get` returns `anyhow::Result`.
anyhow = "1"
directories = "6"
md5 = "0.8"
serde.workspace = true
serde_json.workspace = true
discord-rich-presence = "1.1"

[dev-dependencies]
wiremock = "0.6"
# Paused time: the Last.fm connect's poll.
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0", features = ["build"] }
