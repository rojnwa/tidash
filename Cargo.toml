[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.0.0-rc.3"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["glow", "accesskit", "wayland", "x11", "default_fonts"] }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }

# egui and winit forks required by fastframe (fastframe v0.13.0 getting-started guide)
[patch.crates-io]
ecolor = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
eframe = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
emath = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
epaint = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
# crmne/winit ed7caa9 plus the window-minimum fix (crmne/winit#4); back to crmne's rev once it merges.
winit = { git = "https://github.com/rojnwa/winit", rev = "0149e5d3c65962dc3ecbfb1d9f62651bb25c8071" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
